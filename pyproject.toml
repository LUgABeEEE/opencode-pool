[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-pool"
version = "0.2.0"
description = "OpenCode 号池：把多个 OpenCode Go 订阅账号合成一个 OpenAI 兼容入口"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]
keywords = ["opencode", "account-pool", "relay", "openai-compatible", "dsh-plugin"]

[project.scripts]
opencode-pool = "opencode_pool.cli:main"

[tool.setuptools]
packages = ["opencode_pool", "opencode_pool.adapters"]

[tool.setuptools.package-data]
opencode_pool = ["panel/*.html"]

[tool.ruff]
# 与代码实际风格一致：本项目按 120 列排版（默认 88 会制造大量噪声）
line-length = 120
target-version = "py310"
# 只开高价值规则：语法/未定义名/未用导入。格式类（缩进/引号）交给编辑器，不塞进 CI。
lint.select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试里的断言式长行与 fixture 名称无需苛求
"tests/*" = ["E501"]
