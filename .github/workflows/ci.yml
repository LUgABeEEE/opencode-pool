# CI：语法 + 静态检查 + 回归。不联网打外部服务、不需要任何密钥。
#
#   python    —— compileall（语法）+ ruff（未定义名/未用导入/语法级 E9）+ stdlib unittest（3.10/3.11/3.12）
#   node      —— DSH 插件纯逻辑测试 node:test（20/22）
#   stability —— 手动触发或每周一跑：verify.sh 的 20 连绿（慢，不进每次 push）
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC —— 跑稳定性证据，抓偶发 flaky
    - cron: "17 3 * * 1"

# 同一分支上新的推送取消旧的运行，省 runner 也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只需要读代码；不写仓库、不碰 secrets
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 语法检查（compileall，不联网）
        run: python3 -m compileall -q opencode_pool tests scripts

      # 测试本身不联网、不起真实上游（端到端用例起本地 FakeUpstream）；
      # 运行时依赖只有 requests。
      - name: 安装依赖
        run: python3 -m pip install --quiet requests ruff

      - name: 静态检查（ruff：未定义名 / 未用导入 / 语法级规则）
        run: python3 -m ruff check opencode_pool tests scripts

      - name: Python 回归（unittest）
        run: python3 -m unittest discover -s tests

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 纯逻辑测试：零依赖、不联网、不启动服务
      - name: DSH 插件测试（node:test）
        run: node --test tests/plugin.test.mjs

  # 历史教训：套件曾经"跑一次绿、跑十次红八次"。稳定性证据不放进每次 push（慢），
  # 但必须定期跑，否则 flaky 会悄悄回来。
  stability:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: python3 -m pip install --quiet requests

      - name: 稳定性证据（discover ×20 + ReadinessTest ×20 + 每文件）
        run: bash scripts/verify.sh 20
