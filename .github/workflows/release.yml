# 发布：推一个 v* tag 即由 Actions 自动发布到 npm（带 provenance 与 GitHub Release）。
#
# 两个包，同一个 tag：
#   opencode-pool             —— 本体（Python 服务 + 文档 + 插件源码），仓库根
#   dsh-plugin-opencode-pool  —— DSH 插件，dsh-plugin/
#
# 需要仓库 secret：NPM_TOKEN
#   npmjs.com → Access Tokens → Generate New Token → **Automation**（绕过 OTP，适合 CI）
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# 为什么不用 `npm login` 手动发：npm 的 web 登录会回落到交互式用户名/密码/OTP，
# 在无人值守的机器上走不通；Automation token + Actions 才是可复现的路径。
#
# 注意：granular token 的发布会进 npm 的「暂存发布」（staged），需要在网页上批准一次；
# 想彻底免掉这一步就配 Trusted Publisher（见 docs/releasing.md）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打包不发布（预演）"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write      # 建 GitHub Release
  id-token: write      # npm provenance

jobs:
  # 发布前再跑一遍回归：tag 可能打在别人没跑过 CI 的提交上
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: python3 -m pip install --quiet requests ruff

      - name: 静态检查
        run: python3 -m ruff check opencode_pool tests scripts

      - name: Python 回归
        run: python3 -m unittest discover -s tests

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: DSH 插件测试
        run: node --test tests/plugin.test.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: opencode-pool
            dir: .
          - package: dsh-plugin-opencode-pool
            dir: dsh-plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # tag（dispatch 时取根 manifest）、本包 manifest、pyproject 三处版本必须一致
      - name: 版本一致性
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag=$(node -p "require('./package.json').version")
          fi
          if [ "${{ matrix.dir }}" = "." ]; then manifest="./package.json"; else manifest="./${{ matrix.dir }}/package.json"; fi
          mine=$(node -p "require('$manifest').version")
          python=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1))
          PY
          )
          echo "event=${GITHUB_EVENT_NAME} tag=$tag mine=$mine python=$python"
          [ "$tag" = "$mine" ] || { echo "::error::${{ matrix.package }} manifest $mine 与 tag $tag 不一致"; exit 1; }
          [ "$tag" = "$python" ] || { echo "::error::pyproject.toml $python 与 tag $tag 不一致"; exit 1; }

      - name: 密钥检查
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少 NPM_TOKEN secret（npmjs.com → Access Tokens → Automation）"
            exit 1
          fi

      # 打包清单要在日志里：发布出去的就是这些文件，人眼能核
      - name: 打包预演
        working-directory: ${{ matrix.dir }}
        run: npm pack --dry-run

      # 同一个版本重复触发时直接跳过，而不是红一次
      - name: 是否已发布
        id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ matrix.dir }}" = "." ]; then manifest="./package.json"; else manifest="./${{ matrix.dir }}/package.json"; fi
          version=$(node -p "require('$manifest').version")
          if npm view "${{ matrix.package }}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.package }}@${version} 已存在，跳过发布"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm
        if: steps.exists.outputs.already == 'false' && github.event.inputs.dry_run != 'true'
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: 预演模式（不发布）
        if: steps.exists.outputs.already == 'false' && github.event.inputs.dry_run == 'true'
        working-directory: ${{ matrix.dir }}
        run: echo "::notice::dry_run=true，未执行 npm publish"

  announce:
    needs: publish
    if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME 已存在，跳过"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "v${version}" \
              --generate-notes \
              --notes "npm 本体: https://www.npmjs.com/package/opencode-pool/v/${version}
npm DSH 插件: https://www.npmjs.com/package/dsh-plugin-opencode-pool/v/${version}"
          fi
